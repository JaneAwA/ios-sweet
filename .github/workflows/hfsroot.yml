name: hfsroot

# Builds the HFS+ volume that XNU mounts as its BSD root from the internal UFS.
# XNU will only accept an HFS+ volume, and the only HFS+ writer we have access
# to is macOS's newfs_hfs, so this runs on a macos-14 runner even though the
# kernel itself is built there too.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "init = small bring-up volume, ios = full iOS 16 root"
        default: "init"
      size_mb:
        description: HFS+ volume size in MB (init mode)
        default: "32"
      journal:
        description: journaled (1) or plain (0) (init mode)
        default: "1"
      with_init:
        description: install the bring-up init as /sbin/launchd (init mode)
        default: "true"
      ipsw_url:
        description: "HTTPS URL of the IPSW to take the images from (ios mode)"
        default: ""
      dmg_names:
        description: "OS,SystemOS,AppOS image basenames inside the IPSW (ios mode)"
        default: "087-86698-044,087-86593-047,087-86715-047"
      headroom_kb:
        description: free space to leave on the built volume (ios mode)
        default: "1048576"
      sparse:
        description: also emit a sparse image for fastboot (ios mode)
        default: "true"

concurrency:
  group: hfsroot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hfsroot:
    # macos-14's arm64 pool is chronically saturated; jobs there fail with
    # "The job was not acquired by Runner of type hosted" over and over.
    # macos-15 is the same tooling (newfs_hfs, hdiutil, bsdtar) with a
    # healthier queue.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: runner disk
        run: |
          df -h / /System/Volumes/Data 2>/dev/null | head -6

      - name: decode the bring-up init
        if: ${{ inputs.mode != 'ios' && inputs.with_init == 'true' }}
        run: |
          # BSD base64: -D to decode, and it wants -i/-o or redirection.
          base64 -D < tools/sweet-init.b64 > "$RUNNER_TEMP/sweet-init"
          ls -l "$RUNNER_TEMP/sweet-init"
          file "$RUNNER_TEMP/sweet-init"

      - name: build the HFS+ image
        if: ${{ inputs.mode != 'ios' }}
        env:
          JOURNAL: ${{ inputs.journal }}
          LABEL: SweetRoot
        run: |
          init=""
          if [[ "${{ inputs.with_init }}" == "true" ]]; then
            init="$RUNNER_TEMP/sweet-init"
          fi
          chmod +x tools/mkhfsroot.sh
          ./tools/mkhfsroot.sh "$PWD/root-hfs.raw" "${{ inputs.size_mb }}" "$init"

      - name: fetch the IPSW images
        if: ${{ inputs.mode == 'ios' }}
        run: |
          set -euo pipefail
          mkdir -p dmg
          curl -L --retry 3 --retry-delay 5 -o ipsw.zip "${{ inputs.ipsw_url }}"
          ls -l ipsw.zip
          IFS=',' read -r osname sysname appname <<< "${{ inputs.dmg_names }}"
          # One at a time: the IPSW is 6 GB and the images inside it another
          # 7.5 GB, and the target volume has to share the disk with them.
          for n in "$osname" "$sysname" "$appname"; do
            unzip -o -j ipsw.zip "$n.dmg" -d dmg
          done
          rm -f ipsw.zip
          ls -l dmg

      - name: build the iOS root image
        if: ${{ inputs.mode == 'ios' }}
        env:
          LABEL: iOSRoot
        run: |
          set -euo pipefail
          IFS=',' read -r osname sysname appname <<< "${{ inputs.dmg_names }}"
          # Belt-and-suspenders: strip any stray CR so the shebang is never
          # "/bin/bash^M" (CRLF endings silently break the interpreter lookup).
          tr -d '\r' < tools/mkiosroot-macos.sh > tools/mkiosroot-macos.sh.tmp \
            && mv -f tools/mkiosroot-macos.sh.tmp tools/mkiosroot-macos.sh
          chmod +x tools/mkiosroot-macos.sh
          ./tools/mkiosroot-macos.sh "$PWD/ios16-root.raw" \
            "dmg/$osname.dmg" "dmg/$sysname.dmg" "dmg/$appname.dmg" \
            "${{ inputs.headroom_kb }}" 2>&1 | tee mkiosroot.log

      - name: make it sparse
        if: ${{ inputs.mode == 'ios' && inputs.sparse == 'true' }}
        run: |
          python3 tools/img2simg.py ios16-root.raw ios16-root.simg
          # The raw image is thirteen GB of mostly nothing; only the sparse one
          # is worth keeping.
          rm -f ios16-root.raw
          ls -l ios16-root.simg

      - name: compress the sparse image
        if: ${{ inputs.mode == 'ios' && inputs.sparse == 'true' }}
        run: |
          # GitHub rejects a single artifact file above 10 GB, and the root
          # volume is now thirteen GB of payload. The sparse image still holds
          # ten-odd GB of real bytes, so ship it gzipped and let the local
          # side unpack it.
          gzip -9 -c ios16-root.simg > ios16-root.simg.gz
          rm -f ios16-root.simg
          ls -l ios16-root.simg.gz

      - name: fingerprint
        run: |
          shasum -a 256 *.raw *.simg *.simg.gz 2>/dev/null | tee SHA256SUMS || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: mkiosroot.log

      - uses: actions/upload-artifact@v4
        with:
          name: hfs-root
          path: |
            *.raw
            *.simg
            *.simg.gz
            SHA256SUMS
